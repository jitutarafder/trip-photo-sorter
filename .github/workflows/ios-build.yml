name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Compatible Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "Selecting Xcode 16.0"
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            echo "Selecting Xcode 16.1"
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            echo "Selecting Xcode 15.4"
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch TurboModule crash handlers
        run: node scripts/patch-turbomodule.js

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Archive (Code Signing Disabled)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename ios/*.xcodeproj .xcodeproj)
          echo "Building workspace: $WORKSPACE with app scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/TripPhotoSorter.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build -name "*.app" -maxdepth 4 | head -n 1)
          echo "Found application bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build folder"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y TripPhotoSorter-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TripPhotoSorter-unsigned-ipa
          path: build/TripPhotoSorter-unsigned.ipa
          retention-days: 14
